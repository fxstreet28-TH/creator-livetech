<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURUM Live — Tier 02 Moonlight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@600;700;800&family=Kanit:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   AURUM Live — Tier 02 "Moonlight" gift card
   ---------------------------------------------------------------------
   Layers inside .stage (300×300)
     .moon            soft moon disc behind the mascot (CSS, pulses)
     .glitter         16 four-point stars, each twinkles on its own clock
     .mascot-wrap     3D pivot (perspective) — the pirouette lives here
       img.mascot     the PNG body (background removed)
       img.lid        skin-textured eyelid patch → the wink
       .fx-glint      star glint that pops beside the winking eye
       .fx-burst      8 sparkles that burst on the wink
   Master timeline: 5.5s, all synced layers use the same % marks
       0.0–0.6s  ( 0–10.9%)   moonlight rises, glitter wakes up
       0.6–2.0s  (10.9–36.4%) pirouette: rotateY 0→360 with a little hop
       2.0–2.4s  (36.4–43.6%) landing squash
       2.5–3.3s  (45.5–60%)   wink + head tilt + glint + sparkle burst
       3.3–5.5s  (60–100%)    back to smile, idle breathe → loop
   Positions of eye / antenna are CSS vars on .stage (measured from PNG).
   ===================================================================== */
:root{
  --bg-top:#1a0a3e;--bg-bot:#0a0a2e;
  --purple:#a855f7;--cyan:#06b6d4;--gold:#fbbf24;--moon:#fde68a;
  --text:#fff;--text-2:#94a3b8;
  --cycle:5.5s;
  --bounce:cubic-bezier(0.34,1.56,0.64,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Inter",system-ui,sans-serif;background:#050416;color:var(--text);overflow:hidden;-webkit-tap-highlight-color:transparent}

/* ---------- Deep-space background ---------- */
.space{position:fixed;inset:0;
  background:radial-gradient(60% 50% at 20% 80%,rgba(168,85,247,.18),transparent 70%),
             radial-gradient(50% 45% at 85% 15%,rgba(6,182,212,.14),transparent 70%),
             linear-gradient(180deg,#0c0630,#050416)}
.star{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:#fff;opacity:.25;
  animation:twinkle var(--t) ease-in-out infinite var(--d)}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.9;transform:scale(1.15)}}

/* ---------- Layout ---------- */
.center{position:relative;min-height:100dvh;display:grid;place-items:center;padding:24px}
.card-scale{transform:scale(var(--scale,1));transform-origin:center}

/* ---------- Card ---------- */
.card{position:relative;width:400px;height:550px;border-radius:28px;padding:22px 24px 24px;
  display:flex;flex-direction:column;cursor:pointer;user-select:none;
  background:linear-gradient(180deg,var(--bg-top),var(--bg-bot));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 24px rgba(168,85,247,.30);
  transition:transform .35s var(--bounce),box-shadow .35s ease;isolation:isolate}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;
  background:linear-gradient(135deg,rgba(168,85,247,.55),rgba(6,182,212,.55));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;opacity:.6;pointer-events:none}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 60% at 50% -10%,rgba(255,255,255,.08),transparent 60%)}
.card:hover,.card:focus-visible{transform:translateY(-4px);
  box-shadow:0 34px 70px rgba(0,0,0,.6),0 0 44px rgba(168,85,247,.5);outline:none}
.card:focus-visible{box-shadow:0 34px 70px rgba(0,0,0,.6),0 0 0 3px rgba(6,182,212,.7)}
.card:hover .name{text-shadow:0 0 18px rgba(253,230,138,.9),0 0 40px rgba(168,85,247,.5)}

/* ---------- Header ---------- */
.head{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.08em}
.badge{font-family:"Bebas Neue",sans-serif;font-size:13px;letter-spacing:.14em;padding:4px 9px 3px;border-radius:6px;
  background:rgba(6,182,212,.22);color:#a5f3fc;border:1px solid rgba(6,182,212,.5)}
.rank{font-family:"Bebas Neue",sans-serif;font-size:14px;letter-spacing:.14em;color:var(--text-2)}
.icons{margin-left:auto;display:flex;gap:8px;align-items:center}
.icons button{background:none;border:0;cursor:pointer;font-size:16px;line-height:1;color:var(--text-2);
  transition:transform .2s var(--bounce),color .2s;padding:2px}
.icons button:hover{transform:scale(1.2)}
.icons .fav.on{color:#f472b6;text-shadow:0 0 10px rgba(244,114,182,.8)}

/* ---------- Stage ---------- */
.stage{
  --eye-x:59.8%; --eye-y:41.5%;      /* right eye (the one that winks) */
  --antenna-x:55.1%; --antenna-y:7.8%;
  position:relative;width:300px;height:300px;margin:10px auto 0;border-radius:20px;
  perspective:900px;overflow:visible;
}
.moon{position:absolute;left:50%;top:54%;width:230px;height:230px;border-radius:50%;
  transform:translate(-50%,-50%);opacity:.5;
  background:radial-gradient(circle,rgba(255,255,255,.22) 0%,rgba(253,230,138,.12) 40%,rgba(255,255,255,.05) 62%,transparent 70%);
  filter:blur(1px);will-change:transform,opacity}
.glitter{position:absolute;inset:0;pointer-events:none}
.glitter svg{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);
  transform:translate(-50%,-50%);color:#fff;
  filter:drop-shadow(0 0 4px rgba(253,230,138,.9)) drop-shadow(0 0 10px rgba(6,182,212,.5));
  animation:glint var(--t) ease-in-out infinite var(--d);opacity:0}
.glitter svg:nth-child(3n){color:var(--moon)} .glitter svg:nth-child(4n){color:#a5f3fc}
@keyframes glint{0%,100%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(0)}
                 50%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(90deg)}}

.mascot-wrap{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:50% 60%;will-change:transform}
.mascot{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;
  filter:drop-shadow(0 0 10px rgba(6,182,212,.55)) drop-shadow(0 0 26px rgba(253,230,138,.22))}
.lid{position:absolute;left:var(--eye-x);top:var(--eye-y);width:27px;height:27px;
  transform:translate(-50%,-50%);opacity:0;pointer-events:none;will-change:opacity,transform}
.fx{position:absolute;pointer-events:none;opacity:0;will-change:transform,opacity}
.fx-glint{left:calc(var(--eye-x) + 26px);top:calc(var(--eye-y) - 22px);width:22px;height:22px;color:var(--moon);
  filter:drop-shadow(0 0 6px rgba(253,230,138,1))}
.fx-glint svg,.fx-burst svg{width:100%;height:100%;display:block}
.fx-antenna{left:var(--antenna-x);top:var(--antenna-y);width:44px;height:44px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(255,244,190,.95),rgba(253,230,138,.5) 40%,transparent 70%);filter:blur(2px)}
.fx-burst{left:50%;top:50%;width:13px;height:13px;color:var(--moon);transform:translate(-50%,-50%) scale(0)}
.fx-burst:nth-child(even){color:#a5f3fc}
.fx-burst svg{filter:drop-shadow(0 0 4px currentColor)}
.fx-bubble{left:50%;top:6px;margin-left:56px;transform:translate(-50%,0) scale(.8);
  font:500 16px/1 "Kanit",sans-serif;color:#1a0a3e;background:#fff;padding:8px 13px;border-radius:14px;
  box-shadow:0 6px 18px rgba(0,0,0,.3)}
.fx-bubble::after{content:"";position:absolute;left:14px;bottom:-7px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}

/* ---------- Text / footer ---------- */
.name{margin-top:14px;font-family:"Bebas Neue",sans-serif;font-size:58px;line-height:.95;letter-spacing:.1em;text-align:center;
  text-shadow:0 0 14px rgba(253,230,138,.45);transition:text-shadow .35s ease}
.sub{font-family:"Kanit",sans-serif;font-weight:500;font-size:15px;color:var(--text-2);text-align:center;margin-top:2px}
.foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
.price{font:800 14px/1 "Inter",sans-serif;letter-spacing:.06em;padding:10px 16px;border-radius:999px;color:#04131a;
  background:linear-gradient(135deg,#67e8f9,var(--cyan));box-shadow:0 0 18px rgba(6,182,212,.45)}
.sent{font-size:12px;color:var(--text-2)} .sent b{font-weight:700;color:var(--gold)}

/* ---------- Master timeline ---------- */
.playing .moon{animation:moonRise var(--cycle) ease-in-out infinite}
.playing .mascot-wrap{animation:pirouette var(--cycle) cubic-bezier(.45,.05,.35,1) infinite}
.playing .lid{animation:wink var(--cycle) steps(1,end) infinite}
.playing .fx-glint{animation:glintPop var(--cycle) var(--bounce) infinite}
.playing .fx-antenna{animation:antennaGlow var(--cycle) ease-in-out infinite}
.playing .fx-burst{animation:burst var(--cycle) ease-out infinite}
.playing .fx-bubble{animation:bubble var(--cycle) var(--bounce) infinite}

@keyframes moonRise{
  0%{opacity:.25;transform:translate(-50%,-50%) scale(.85)}
  10.9%{opacity:.75;transform:translate(-50%,-50%) scale(1.02)}
  36.4%{opacity:.75;transform:translate(-50%,-50%) scale(1)}
  60%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}
  100%{opacity:.5;transform:translate(-50%,-50%) scale(.95)}
}
/* pirouette: turn around on the spot with a small hop, land with a squash */
@keyframes pirouette{
  0%,10.9%{transform:rotateY(0) translateY(0) scale(1)}
  23.6%   {transform:rotateY(180deg) translateY(-12px) scale(.97)}
  36.4%   {transform:rotateY(360deg) translateY(0) scale(1)}
  39%     {transform:rotateY(360deg) translateY(2px) scale(1.06,.93)}
  43.6%   {transform:rotateY(360deg) translateY(0) scale(1)}
  45.5%   {transform:rotateY(360deg) rotate(0)}
  48%     {transform:rotateY(360deg) rotate(-4deg)}
  58%     {transform:rotateY(360deg) rotate(-4deg)}
  62%     {transform:rotateY(360deg) rotate(0) scale(1)}
  80%     {transform:rotateY(360deg) scale(1.02)}
  100%    {transform:rotateY(360deg) scale(1)}
}
@keyframes wink{0%,45.5%{opacity:0}46.5%,59%{opacity:1}60%,100%{opacity:0}}
@keyframes glintPop{
  0%,46%{opacity:0;transform:scale(.2) rotate(0)}
  49%{opacity:1;transform:scale(1.25) rotate(45deg)}
  52%{opacity:1;transform:scale(.9) rotate(90deg)}
  58%,100%{opacity:0;transform:scale(.3) rotate(180deg)}
}
@keyframes antennaGlow{0%{opacity:.15}10.9%{opacity:.55}36.4%{opacity:.35}47%{opacity:1}62%{opacity:.35}100%{opacity:.2}}
@keyframes burst{
  0%,46%{opacity:0;transform:translate(-50%,-50%) scale(0) rotate(0)}
  50%{opacity:1;transform:translate(calc(-50% + var(--tx)*.35),calc(-50% + var(--ty)*.35)) scale(1.1) rotate(60deg)}
  62%,100%{opacity:0;transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(.2) rotate(200deg)}
}
@keyframes bubble{
  0%,48%{opacity:0;transform:translate(-50%,6px) scale(.8)}
  53%{opacity:1;transform:translate(-50%,0) scale(1)}
  64%{opacity:1;transform:translate(-50%,0) scale(1)}
  70%,100%{opacity:0;transform:translate(-50%,-6px) scale(.95)}
}
@media (prefers-reduced-motion:reduce){
  .star,.glitter svg{animation:none;opacity:.6}
  .playing .mascot-wrap,.playing .moon,.playing .lid,.playing .fx{animation:none}
  .card{transition:none}
}
</style>
</head>

<script>
(() => {
  const stage=document.getElementById('stage'), card=document.getElementById('card');
  const starSvg='<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 0l2.6 8.6L24 12l-9.4 3.4L12 24l-2.6-8.6L0 12l9.4-3.4z"/></svg>';

  /* glitter field — 16 stars around the mascot, each on its own clock */
  const g=document.getElementById('glitter');
  const spots=[[12,18],[26,8],[44,5],[64,7],[82,14],[92,30],[95,52],[90,72],[80,88],[60,94],[38,95],[18,86],[6,66],[4,44],[30,30],[74,34]];
  g.innerHTML=spots.map(([x,y],i)=>`<svg viewBox="0 0 24 24" style="--x:${x}%;--y:${y}%;--s:${8+(i*7)%12}px;--t:${2+(i*.37)%1.8}s;--d:-${(i*.53)%2.4}s"><path fill="currentColor" d="M12 0l2.6 8.6L24 12l-9.4 3.4L12 24l-2.6-8.6L0 12l9.4-3.4z"/></svg>`).join('');

  /* sparkle burst vectors (from the winking eye) */
  document.querySelectorAll('.fx-burst').forEach((el,i,all)=>{
    const a=(i/all.length)*Math.PI*2-.4, d=95+(i%3)*22;
    el.style.left='calc(var(--eye-x) + 8px)'; el.style.top='var(--eye-y)';
    el.style.setProperty('--tx',Math.cos(a)*d+'px'); el.style.setProperty('--ty',Math.sin(a)*d+'px');
    el.innerHTML=starSvg;
  });

  function replay(){stage.classList.remove('playing');void stage.offsetWidth;stage.classList.add('playing')}
  card.addEventListener('click',e=>{if(e.target.closest('.icons'))return;replay()});
  card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();replay()}});
  document.getElementById('fav').addEventListener('click',e=>e.currentTarget.classList.toggle('on'));

  /* background stars */
  const space=document.getElementById('space'),frag=document.createDocumentFragment();
  for(let i=0;i<28;i++){const s=document.createElement('span');s.className='star';
    s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;--s:${1+Math.random()*2.2}px;--t:${2.5+Math.random()*3}s;--d:-${Math.random()*4}s`;frag.appendChild(s)}
  space.appendChild(frag);

  /* responsive scale */
  const scaler=document.getElementById('cardScale');
  function fit(){scaler.style.setProperty('--scale',Math.min(1,(innerWidth-32)/400,(innerHeight-32)/550).toFixed(3))}
  fit();addEventListener('resize',fit);
})();
</script>
