<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURUM Live — Tier 01 Stardust</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@600;700;800&family=Kanit:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   AURUM Live — Tier 01 "Stardust" gift card
   ---------------------------------------------------------------------
   Structure
     .space           full-screen deep-space background + twinkling stars
     .card-scale      scales the fixed 400×550 card down on small screens
     .card            glassmorphism card (hover lift, click = replay)
     .stage           300×300 animation canvas
       img.mascot     THE PNG — untouched, only transformed
       .fx-*          overlay layers (glow, hand, bubble, sparkles, "!")
   Timeline
     One master cycle of 4.5s. Every layer uses the same 4.5s duration
     and keyframe percentages so they stay in sync when looping.
       0.0–0.8s  ( 0.0–17.8%)  peek up
       0.8–1.3s  (17.8–28.9%)  surprised bounce + "!"
       1.3–2.3s  (28.9–51.1%)  wave hello
       2.3–3.0s  (51.1–66.7%)  happy settle: sparkles, bubble, glow
       3.0–4.5s  (66.7–100%)   idle breathe → loop
   Replay: remove .playing from .stage, force reflow, add it back.
   Tweak mascot-relative positions via the CSS vars on .stage
   (--mouth-x/y, --antenna-x/y, --hand-x/y) after you drop in the PNG.
   ===================================================================== */

:root{
  --bg-top:#1a0a3e;
  --bg-bot:#0a0a2e;
  --purple:#a855f7;
  --cyan:#06b6d4;
  --gold:#fbbf24;
  --text:#ffffff;
  --text-2:#94a3b8;
  --cycle:4.5s;
  --bounce:cubic-bezier(0.34,1.56,0.64,1);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Inter",system-ui,sans-serif;
  background:#050416;
  color:var(--text);
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}

/* ---------- Deep-space background ---------- */
.space{
  position:fixed;inset:0;
  background:
    radial-gradient(60% 50% at 20% 80%, rgba(168,85,247,.18), transparent 70%),
    radial-gradient(50% 45% at 85% 15%, rgba(6,182,212,.14), transparent 70%),
    linear-gradient(180deg,#0c0630 0%,#050416 100%);
}
.star{
  position:absolute;
  width:var(--s);height:var(--s);
  border-radius:50%;
  background:#fff;
  opacity:.25;
  animation:twinkle var(--t) ease-in-out infinite var(--d);
}
@keyframes twinkle{
  0%,100%{opacity:.15;transform:scale(.8)}
  50%{opacity:.9;transform:scale(1.15)}
}

/* ---------- Layout ---------- */
.center{
  position:relative;
  min-height:100dvh;
  display:grid;place-items:center;
  padding:24px;
}
.card-scale{
  transform:scale(var(--scale,1));
  transform-origin:center;
}

/* ---------- Card ---------- */
.card{
  position:relative;
  width:400px;height:550px;
  border-radius:28px;
  padding:22px 24px 24px;
  display:flex;flex-direction:column;
  cursor:pointer;
  user-select:none;
  background:linear-gradient(180deg,var(--bg-top),var(--bg-bot));
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 24px rgba(168,85,247,.30);
  transition:transform .35s var(--bounce),box-shadow .35s ease;
  isolation:isolate;
}
/* gradient border at 30% */
.card::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;
  background:linear-gradient(135deg,rgba(168,85,247,.55),rgba(6,182,212,.55));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  opacity:.6;pointer-events:none;
}
/* inner sheen */
.card::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 60% at 50% -10%,rgba(255,255,255,.08),transparent 60%);
}
.card:hover,.card:focus-visible{
  transform:translateY(-4px);
  box-shadow:0 34px 70px rgba(0,0,0,.6),0 0 44px rgba(168,85,247,.5);
  outline:none;
}
.card:focus-visible{box-shadow:0 34px 70px rgba(0,0,0,.6),0 0 0 3px rgba(6,182,212,.7)}
.card:hover .name{text-shadow:0 0 18px rgba(168,85,247,.9),0 0 40px rgba(168,85,247,.5)}

/* ---------- Header ---------- */
.head{
  display:flex;align-items:center;gap:10px;
  font-size:11px;letter-spacing:.08em;
}
.badge{
  font-family:"Bebas Neue",sans-serif;font-size:13px;letter-spacing:.14em;
  padding:4px 9px 3px;border-radius:6px;
  background:rgba(168,85,247,.28);color:#e9d5ff;
  border:1px solid rgba(168,85,247,.5);
}
.rank{font-family:"Bebas Neue",sans-serif;font-size:14px;letter-spacing:.14em;color:var(--text-2)}
.icons{margin-left:auto;display:flex;gap:8px;align-items:center}
.icons button{
  background:none;border:0;cursor:pointer;font-size:16px;line-height:1;
  color:var(--text-2);transition:transform .2s var(--bounce),color .2s;padding:2px;
}
.icons button:hover{transform:scale(1.2)}
.icons .fav.on{color:#f472b6;text-shadow:0 0 10px rgba(244,114,182,.8)}

/* ---------- Stage (300×300 animation canvas) ---------- */
.stage{
  --mouth-x:50%;  --mouth-y:51%;    /* where the mouth glow sits (over PNG) */
  --antenna-x:50%;--antenna-y:9%;   /* antenna ball tip */
  --shoulder-x:68.4%;--shoulder-y:63.8%;  /* pivot of the right arm (from PNG) */
  position:relative;
  width:300px;height:300px;
  margin:10px auto 0;
  overflow:hidden;               /* mascot rises from below this edge */
  border-radius:20px;
}
.mascot-wrap{
  position:absolute;inset:0;
  transform:translateY(100%);
  opacity:0;
  transform-origin:50% 90%;
  will-change:transform,opacity;
}
.mascot{
  width:100%;height:100%;
  object-fit:contain;
  display:block;
  filter:drop-shadow(0 0 10px rgba(6,182,212,.55)) drop-shadow(0 0 26px rgba(6,182,212,.25));
  pointer-events:none;
}
.mascot-arm{
  position:absolute;inset:0;
  transform-origin:var(--shoulder-x) var(--shoulder-y);
  will-change:transform;
}
/* shown only if the PNG is missing next to this file */
.stage.missing .mascot{display:none}
.stage.missing .mascot-wrap::after{
  content:"stardust-mascot.png\A ใส่ไฟล์ PNG ไว้โฟลเดอร์เดียวกัน";
  white-space:pre;text-align:center;
  position:absolute;inset:40px;border-radius:50%;
  display:grid;place-items:center;
  font:500 12px/1.6 "Kanit",sans-serif;color:var(--text-2);
  border:2px dashed rgba(148,163,184,.45);
  background:radial-gradient(circle,rgba(168,85,247,.25),rgba(10,10,46,.6));
}

/* overlays live inside .mascot-wrap so they move with the body */
.fx{position:absolute;pointer-events:none;opacity:0;will-change:transform,opacity}

.fx-mouth{
  left:var(--mouth-x);top:var(--mouth-y);
  width:70px;height:40px;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse,rgba(255,255,255,.55),rgba(251,191,36,.25) 45%,transparent 70%);
  filter:blur(4px);
}
.fx-antenna{
  left:var(--antenna-x);top:var(--antenna-y);
  width:46px;height:46px;transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,240,170,.95),rgba(251,191,36,.55) 40%,transparent 70%);
  filter:blur(2px);
}
.fx-bang{
  left:50%;top:-4px;
  font:700 34px/1 "Inter",sans-serif;color:var(--gold);
  text-shadow:0 0 12px rgba(251,191,36,.9);
  transform:translate(-50%,0) scale(.3);
}
.fx-bubble{
  left:50%;top:14px;
  transform:translate(-50%,0) scale(.8);
  font:500 17px/1 "Kanit",sans-serif;color:#1a0a3e;
  background:#fff;padding:8px 14px;border-radius:14px;
  box-shadow:0 6px 18px rgba(0,0,0,.3);
  margin-left:58px;
}
.fx-bubble::after{
  content:"";position:absolute;left:14px;bottom:-7px;
  border:8px solid transparent;border-top-color:#fff;border-bottom:0;
}

/* sparkles — position via --tx / --ty set in JS */
.fx-spark{
  left:50%;top:50%;
  width:14px;height:14px;
  transform:translate(-50%,-50%) scale(0);
  color:var(--gold);
}
.fx-spark:nth-child(even){color:var(--cyan)}
.fx-spark svg{width:100%;height:100%;filter:drop-shadow(0 0 4px currentColor)}

/* ---------- Text ---------- */
.name{
  margin-top:14px;
  font-family:"Bebas Neue",sans-serif;
  font-size:58px;line-height:.95;letter-spacing:.1em;
  text-align:center;
  text-shadow:0 0 14px rgba(168,85,247,.55);
  transition:text-shadow .35s ease;
}
.sub{
  font-family:"Kanit",sans-serif;font-weight:500;
  font-size:15px;color:var(--text-2);text-align:center;margin-top:2px;
}

/* ---------- Footer ---------- */
.foot{
  margin-top:auto;
  display:flex;align-items:center;justify-content:space-between;
}
.price{
  font:800 14px/1 "Inter",sans-serif;letter-spacing:.06em;
  padding:10px 16px;border-radius:999px;color:#04131a;
  background:linear-gradient(135deg,#67e8f9,var(--cyan));
  box-shadow:0 0 18px rgba(6,182,212,.45);
}
.sent{font-size:12px;color:var(--text-2)}
.sent b{font-weight:700;color:var(--gold)}

/* ---------- Master timeline (4.5s cycle) ---------- */
.playing .mascot-wrap{animation:mascotBody var(--cycle) ease-out infinite}
.playing .fx-bang{animation:bang var(--cycle) var(--bounce) infinite}
.playing .playing .mascot-arm{animation:armWave var(--cycle) ease-in-out infinite}
.playing .fx-bubble{animation:bubble var(--cycle) var(--bounce) infinite}
.playing .fx-mouth{animation:mouthGlow var(--cycle) ease-in-out infinite}
.playing .fx-antenna{animation:antennaGlow var(--cycle) ease-in-out infinite}
.playing .fx-spark{animation:spark var(--cycle) ease-out infinite}

/* body: peek → bounce/pop (eye-widen stand-in) → tilt during wave → breathe */
@keyframes mascotBody{
  0%    {transform:translateY(100%);opacity:0}
  8.9%  {transform:translateY(55%);opacity:1}
  17.8% {transform:translateY(0)}
  20.5% {transform:translateY(-8px) scale(1.06)}
  24%   {transform:translateY(0) scale(1)}
  28.9% {transform:rotate(0)}
  33%   {transform:rotate(3deg)}
  42%   {transform:rotate(-3deg)}
  51.1% {transform:rotate(0)}
  66.7% {transform:scale(1)}
  83.3% {transform:scale(1.02)}
  100%  {transform:scale(1);opacity:1}
}
@keyframes bang{
  0%,17.8%{opacity:0;transform:translate(-50%,6px) scale(.3)}
  20.5%   {opacity:1;transform:translate(-50%,-6px) scale(1.2)}
  24%     {opacity:1;transform:translate(-50%,-6px) scale(1)}
  28.9%,100%{opacity:0;transform:translate(-50%,-18px) scale(.9)}
}
/* arm hangs at rest (0deg); negative = raises up to the right */
@keyframes armWave{
  0%,27%  {transform:rotate(0)}
  31%     {transform:rotate(-105deg)}
  34.5%   {transform:rotate(-125deg)}
  38%     {transform:rotate(-88deg)}
  41.5%   {transform:rotate(-125deg)}
  45%     {transform:rotate(-88deg)}
  48.5%   {transform:rotate(-115deg)}
  53%,100%{transform:rotate(0)}
}
@keyframes bubble{
  0%,51.1%{opacity:0;transform:translate(-50%,6px) scale(.8)}
  57.8%   {opacity:1;transform:translate(-50%,0) scale(1)}
  66.7%   {opacity:1;transform:translate(-50%,0) scale(1)}
  73%,100%{opacity:0;transform:translate(-50%,-6px) scale(.95)}
}
@keyframes mouthGlow{
  0%,51.1%{opacity:0}
  58%     {opacity:.9}
  70%,100%{opacity:0}
}
@keyframes antennaGlow{
  0%,17.8%{opacity:0}
  20%     {opacity:.35}
  51.1%   {opacity:.35}
  58%     {opacity:1}
  75%     {opacity:.3}
  90%     {opacity:.5}
  100%    {opacity:.3}
}
@keyframes spark{
  0%,51.1%{opacity:0;transform:translate(-50%,-50%) scale(0) rotate(0)}
  55%     {opacity:1;transform:translate(calc(-50% + var(--tx) * .35),calc(-50% + var(--ty) * .35)) scale(1.1) rotate(60deg)}
  66.7%,100%{opacity:0;transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(.2) rotate(200deg)}
}

@media (prefers-reduced-motion:reduce){
  .star{animation:none}
  .playing .mascot-wrap{animation:none;transform:none;opacity:1}
  .playing .mascot-arm{animation:none}
  .playing .fx{animation:none;opacity:0}
  .card{transition:none}
}
</style>
</head>
<body>

<div class="space" id="space"></div>

<main class="center">
  <div class="card-scale" id="cardScale">
    <article class="card" id="card" tabindex="0" role="button" aria-label="Tier 01 Stardust — คลิกเพื่อเล่นซ้ำ">

      <header class="head">
        <span class="badge">Tier 01</span>
        <span class="rank">Basic</span>

          <button type="button" class="fav" id="fav" aria-label="favorite">♥</button>
        </div>

      <!-- 300×300 animation canvas -->
      <div class="stage playing" id="stage">

<script>
(() => {
  const stage  = document.getElementById('stage');
  const card   = document.getElementById('card');
  const mascot = document.getElementById('mascot');

  /* ---- PNG missing? show a placeholder so the card still previews ---- */
  mascot.addEventListener('error', () => stage.classList.add('missing'));

  /* ---- sparkle burst vectors + star SVG ---- */
  const starSvg = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 0l2.6 8.6L24 12l-9.4 3.4L12 24l-2.6-8.6L0 12l9.4-3.4z"/></svg>';
  document.querySelectorAll('.fx-spark').forEach((el, i, all) => {
    const a = (i / all.length) * Math.PI * 2 + (i % 2 ? .3 : 0);
    const d = 105 + (i % 3) * 22;
    el.style.setProperty('--tx', Math.cos(a) * d + 'px');
    el.style.setProperty('--ty', Math.sin(a) * d + 'px');
    el.innerHTML = starSvg;
  });

  /* ---- replay: restart the master timeline ---- */
  function replay(){
    stage.classList.remove('playing');
    void stage.offsetWidth;          // force reflow so animations reset
    stage.classList.add('playing');
  }
  card.addEventListener('click', e => {
    if (e.target.closest('.icons')) return;
    replay();
  });
  card.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); replay(); }
  });

  /* ---- favorite heart (cosmetic) ---- */
  document.getElementById('fav').addEventListener('click', e => {
    e.currentTarget.classList.toggle('on');
  });

  /* ---- twinkling background stars ---- */
  const space = document.getElementById('space');
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 28; i++) {
    const s = document.createElement('span');
    s.className = 'star';
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;--s:${1 + Math.random()*2.2}px;--t:${2.5 + Math.random()*3}s;--d:-${Math.random()*4}s`;
    frag.appendChild(s);
  }
  space.appendChild(frag);

  /* ---- responsive: scale the 400×550 card to fit small screens ---- */
  const scaler = document.getElementById('cardScale');
  function fit(){
    const s = Math.min(1, (window.innerWidth - 32) / 400, (window.innerHeight - 32) / 550);
    scaler.style.setProperty('--scale', s.toFixed(3));
  }
  fit();
  window.addEventListener('resize', fit);
})();
</script>
