<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURUM Live — Tier 04 Nova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@600;700;800&family=Kanit:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   AURUM Live — Tier 04 "Nova" gift card
   ---------------------------------------------------------------------
   Scene inside .stage (300×300, clipped)
     .sky             star dots
     .earth           planet at the bottom (ground line at y≈222)
     .meteor          rock + fire trail, falls in from top-right
     .fx-alert        "!" warning above the meteor
     .hero            body-wrap (150×150) standing on Earth → launches up
       img.body       the Nova mascot
       .charge        chest-star glow (charging pulse)
       .ring ×3       charge rings
       .beam          nova beam from the chest to the meteor
     .fx-flash        white-out on impact
     .fx-shard ×12    meteor fragments
     .fx-bubble       "โลกปลอดภัยแล้ว"
   Master timeline: 10s
       0.0–1.2s  ( 0–12%)   meteor appears, "!" alert, hero looks up
       1.2–2.4s  (12–24%)   hero launches off Earth
       2.4–3.6s  (24–36%)   charging: chest star glows, rings pulse
       3.6–4.4s  (36–44%)   beam fires, meteor shakes and cracks
       4.4–5.2s  (44–52%)   meteor shatters: flash + shards + shake
       5.2–6.6s  (52–66%)   hero descends and lands back on Earth
       6.6–10s   (66–100%)  hero pose, Earth glows, bubble → loop
   ===================================================================== */
:root{
  --bg-top:#1a0a3e;--bg-bot:#0a0a2e;
  --purple:#a855f7;--cyan:#06b6d4;--gold:#fbbf24;--nova:#fde68a;--text:#fff;--text-2:#94a3b8;
  --cycle:10s;--bounce:cubic-bezier(0.34,1.56,0.64,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Inter",system-ui,sans-serif;background:#050416;color:var(--text);overflow:hidden;-webkit-tap-highlight-color:transparent}
.space{position:fixed;inset:0;background:radial-gradient(60% 50% at 20% 80%,rgba(168,85,247,.18),transparent 70%),radial-gradient(50% 45% at 85% 15%,rgba(6,182,212,.14),transparent 70%),linear-gradient(180deg,#0c0630,#050416)}
.star{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:#fff;opacity:.25;animation:twinkle var(--t) ease-in-out infinite var(--d)}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.9;transform:scale(1.15)}}
.center{position:relative;min-height:100dvh;display:grid;place-items:center;padding:24px}
.card-scale{transform:scale(var(--scale,1));transform-origin:center}

.card{position:relative;width:400px;height:550px;border-radius:28px;padding:22px 24px 24px;display:flex;flex-direction:column;cursor:pointer;user-select:none;
  background:linear-gradient(180deg,var(--bg-top),var(--bg-bot));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 24px rgba(251,191,36,.22);transition:transform .35s var(--bounce),box-shadow .35s ease;isolation:isolate}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:linear-gradient(135deg,rgba(251,191,36,.6),rgba(168,85,247,.55));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.65;pointer-events:none}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 60% at 50% -10%,rgba(255,255,255,.08),transparent 60%)}
.card:hover,.card:focus-visible{transform:translateY(-4px);box-shadow:0 34px 70px rgba(0,0,0,.6),0 0 44px rgba(251,191,36,.45);outline:none}
.card:focus-visible{box-shadow:0 34px 70px rgba(0,0,0,.6),0 0 0 3px rgba(251,191,36,.7)}
.card:hover .name{text-shadow:0 0 18px rgba(253,230,138,.95),0 0 40px rgba(251,191,36,.5)}

.head{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.08em}
.badge{font-family:"Bebas Neue",sans-serif;font-size:13px;letter-spacing:.14em;padding:4px 9px 3px;border-radius:6px;background:linear-gradient(135deg,rgba(251,191,36,.35),rgba(168,85,247,.35));color:#fef3c7;border:1px solid rgba(251,191,36,.6)}
.rank{font-family:"Bebas Neue",sans-serif;font-size:14px;letter-spacing:.14em;color:var(--text-2)}
.icons{margin-left:auto;display:flex;gap:8px;align-items:center}
.icons button{background:none;border:0;cursor:pointer;font-size:16px;line-height:1;color:var(--text-2);transition:transform .2s var(--bounce),color .2s;padding:2px}
.icons button:hover{transform:scale(1.2)} .icons .fav.on{color:#f472b6;text-shadow:0 0 10px rgba(244,114,182,.8)}

/* ---------- Stage ---------- */
.stage{position:relative;width:300px;height:300px;margin:10px auto 0;border-radius:20px;overflow:hidden;background:radial-gradient(70% 50% at 50% 0%,rgba(168,85,247,.2),transparent 70%),#07052a}
.shake{position:absolute;inset:0}
.sky{position:absolute;inset:0;pointer-events:none}
.dot{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff}
.danger{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(70% 70% at 50% 50%,transparent 55%,rgba(239,68,68,.45))}

.earth{position:absolute;left:-50px;top:222px;width:400px;height:400px;border-radius:50%;
  background:radial-gradient(circle at 42% 18%,#5eead4 0%,#22a7c9 18%,#1d5fb8 40%,#123a8a 70%,#0b1f55 100%);
  box-shadow:0 -6px 30px rgba(94,234,212,.55),0 0 60px rgba(34,167,201,.35),inset 0 14px 30px rgba(255,255,255,.28)}
.earth::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(ellipse 60px 30px at 35% 12%,rgba(74,222,128,.75),transparent 70%),radial-gradient(ellipse 40px 22px at 62% 8%,rgba(74,222,128,.7),transparent 70%),radial-gradient(ellipse 90px 40px at 80% 20%,rgba(74,222,128,.55),transparent 70%)}
.earth::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(165,243,252,.35);filter:blur(2px)}

/* meteor */
.meteor{position:absolute;left:222px;top:58px;width:0;height:0;transform:translate(150px,-150px);will-change:transform,opacity}
.rock{position:absolute;left:-26px;top:-24px;width:52px;height:48px;filter:drop-shadow(0 0 10px rgba(251,146,60,.8))}
.trail{position:absolute;left:0;top:0;width:150px;height:34px;transform-origin:left center;transform:translateY(-50%) rotate(-45deg);
  background:linear-gradient(90deg,rgba(255,244,190,.95),rgba(251,146,60,.85) 25%,rgba(239,68,68,.45) 60%,transparent);border-radius:50% 60% 60% 50%;filter:blur(3px);opacity:.9}
.crack{opacity:0}
.fx-alert{left:222px;top:6px;font:800 26px/1 "Inter",sans-serif;color:#fca5a5;text-shadow:0 0 10px #ef4444;transform:translate(-50%,0)}

/* hero */
.hero{position:absolute;left:75px;top:81px;width:150px;height:150px;transform-origin:50% 94%;will-change:transform}
.body{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;filter:drop-shadow(0 0 10px rgba(6,182,212,.5))}
.charge{position:absolute;left:50.1%;top:66.4%;width:70px;height:70px;border-radius:50%;transform:translate(-50%,-50%) scale(.2);opacity:0;pointer-events:none;
  background:radial-gradient(circle,#fff 0%,rgba(253,230,138,.95) 22%,rgba(251,191,36,.55) 45%,transparent 70%);filter:blur(1px);will-change:transform,opacity}
.ring{position:absolute;left:50.1%;top:66.4%;width:60px;height:60px;border-radius:50%;border:2px solid rgba(253,230,138,.9);transform:translate(-50%,-50%) scale(.2);opacity:0;pointer-events:none;box-shadow:0 0 10px rgba(251,191,36,.7)}
/* beam: anchored at the chest, points to the meteor (dx 72, dy -62 → -40.7°, 95px) */
.beam{position:absolute;left:50.1%;top:66.4%;width:100px;height:18px;transform-origin:left center;transform:translateY(-50%) rotate(-40.7deg) scaleX(0);opacity:0;pointer-events:none;
  background:linear-gradient(90deg,#fff,rgba(253,230,138,.95) 30%,rgba(251,191,36,.85) 70%,rgba(168,85,247,.7));border-radius:9px;filter:blur(.6px) drop-shadow(0 0 12px rgba(251,191,36,.9))}
.beam::after{content:"";position:absolute;inset:5px 0;border-radius:9px;background:rgba(255,255,255,.9)}

.fx{position:absolute;pointer-events:none;opacity:0;will-change:transform,opacity}
.fx-flash{inset:0;background:radial-gradient(circle at 222px 58px,#fff 0%,rgba(253,230,138,.9) 20%,rgba(251,191,36,.3) 45%,transparent 70%)}
.fx-shard{left:222px;top:58px;width:14px;height:12px;transform:translate(-50%,-50%) scale(0)}
.fx-shard svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 4px rgba(251,146,60,.9))}
.fx-bubble{left:50%;top:10px;margin-left:8px;transform:translate(-50%,0) scale(.8);font:500 15px/1 "Kanit",sans-serif;color:#1a0a3e;background:#fff;padding:8px 12px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.3);white-space:nowrap}
.fx-bubble::after{content:"";position:absolute;left:18px;bottom:-7px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}

.name{margin-top:14px;font-family:"Bebas Neue",sans-serif;font-size:58px;line-height:.95;letter-spacing:.1em;text-align:center;text-shadow:0 0 14px rgba(251,191,36,.5);transition:text-shadow .35s ease}
.sub{font-family:"Kanit",sans-serif;font-weight:500;font-size:15px;color:var(--text-2);text-align:center;margin-top:2px}
.foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
.price{font:800 14px/1 "Inter",sans-serif;letter-spacing:.06em;padding:10px 16px;border-radius:999px;color:#1a0a3e;background:linear-gradient(135deg,#fde68a,var(--gold));box-shadow:0 0 18px rgba(251,191,36,.5)}
.sent{font-size:12px;color:var(--text-2)} .sent b{font-weight:700;color:var(--gold)}

/* ---------- Master timeline ---------- */
.playing .meteor{animation:meteorFall var(--cycle) linear infinite}
.playing .trail{animation:trailFlicker .18s ease-in-out infinite alternate}
.playing .crack{animation:crack var(--cycle) steps(1,end) infinite}
.playing .fx-alert{animation:alert var(--cycle) ease-in-out infinite}
.playing .danger{animation:danger var(--cycle) ease-in-out infinite}
.playing .hero{animation:heroFlight var(--cycle) ease-in-out infinite}
.playing .charge{animation:charge var(--cycle) ease-in-out infinite}
.playing .ring{animation:ring var(--cycle) ease-out infinite var(--rd)}
.playing .beam{animation:beam var(--cycle) ease-out infinite}
.playing .fx-flash{animation:flash var(--cycle) ease-out infinite}
.playing .fx-shard{animation:shard var(--cycle) ease-out infinite}
.playing .shake{animation:shake var(--cycle) linear infinite}
.playing .earth{animation:earthGlow var(--cycle) ease-in-out infinite}
.playing .fx-bubble{animation:bubble var(--cycle) var(--bounce) infinite}

@keyframes meteorFall{
  0%{transform:translate(150px,-150px) rotate(0);opacity:1}
  12%{transform:translate(78px,-78px) rotate(20deg)}
  36%{transform:translate(8px,-8px) rotate(90deg)}
  38%{transform:translate(3px,-2px) rotate(95deg)}40%{transform:translate(-3px,3px) rotate(98deg)}42%{transform:translate(3px,-2px) rotate(101deg)}
  44%{transform:translate(0,0) rotate(104deg);opacity:1}
  44.5%,100%{transform:translate(0,0) rotate(104deg);opacity:0}
}
@keyframes trailFlicker{from{opacity:.75;transform:translateY(-50%) rotate(-45deg) scaleX(1)}to{opacity:1;transform:translateY(-50%) rotate(-45deg) scaleX(1.12)}}
@keyframes crack{0%,37%{opacity:0}38%{opacity:.6}41%{opacity:1}44.5%,100%{opacity:0}}
@keyframes alert{0%,4%{opacity:0;transform:translate(-50%,8px) scale(.5)}7%{opacity:1;transform:translate(-50%,0) scale(1.2)}9%{transform:translate(-50%,0) scale(1)}11%{transform:translate(-50%,0) scale(1.15)}14%{transform:translate(-50%,0) scale(1)}20%,100%{opacity:0;transform:translate(-50%,-10px) scale(.8)}}
@keyframes danger{0%,8%{opacity:0}14%{opacity:.7}20%{opacity:.2}30%{opacity:.6}44%{opacity:.5}50%,100%{opacity:0}}
/* stand → look up → launch → hover (charging / firing) → drop → land squash → pose */
@keyframes heroFlight{
  0%,6%{transform:translateY(0) scale(1)}
  10%{transform:translateY(0) scale(1.02,.97)}
  12%{transform:translateY(4px) scale(1.06,.9)}
  20%{transform:translateY(-64px) scale(1) rotate(-3deg)}
  24%{transform:translateY(-60px) rotate(0)}
  34%{transform:translateY(-66px) rotate(-6deg)}
  36%{transform:translateY(-58px) rotate(4deg)}
  44%{transform:translateY(-62px) rotate(2deg)}
  52%{transform:translateY(-70px) rotate(0)}
  62%{transform:translateY(-4px) scale(1)}
  64%{transform:translateY(3px) scale(1.1,.88)}
  67%{transform:translateY(-3px) scale(.98,1.03)}
  70%{transform:translateY(0) scale(1)}
  86%{transform:translateY(0) scale(1.02)}
  100%{transform:translateY(0) scale(1)}
}
@keyframes charge{
  0%,22%{opacity:0;transform:translate(-50%,-50%) scale(.2)}
  27%{opacity:.7;transform:translate(-50%,-50%) scale(.6)}
  30%{opacity:.9;transform:translate(-50%,-50%) scale(.9)}
  33%{opacity:.8;transform:translate(-50%,-50%) scale(1.1)}
  36%{opacity:1;transform:translate(-50%,-50%) scale(1.6)}
  37%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
  44%{opacity:.9;transform:translate(-50%,-50%) scale(1.2)}
  48%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
  70%{opacity:0}76%{opacity:.35;transform:translate(-50%,-50%) scale(.6)}84%{opacity:0;transform:translate(-50%,-50%) scale(.9)}100%{opacity:0}
}
@keyframes ring{0%,24%{opacity:0;transform:translate(-50%,-50%) scale(.2)}27%{opacity:1}34%{opacity:0;transform:translate(-50%,-50%) scale(1.8)}
  34.1%,100%{opacity:0}}
@keyframes beam{
  0%,36%{opacity:0;transform:translateY(-50%) rotate(-40.7deg) scaleX(0)}
  37.5%{opacity:1;transform:translateY(-50%) rotate(-40.7deg) scaleX(1)}
  44%{opacity:1;transform:translateY(-50%) rotate(-40.7deg) scaleX(1) scaleY(1.3)}
  47%,100%{opacity:0;transform:translateY(-50%) rotate(-40.7deg) scaleX(1) scaleY(.2)}
}
@keyframes flash{0%,43.5%{opacity:0}44.5%{opacity:1}52%,100%{opacity:0}}
@keyframes shard{
  0%,44%{opacity:0;transform:translate(-50%,-50%) scale(0) rotate(0)}
  46%{opacity:1;transform:translate(calc(-50% + var(--tx)*.3),calc(-50% + var(--ty)*.3)) scale(1.2) rotate(120deg)}
  56%,100%{opacity:0;transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty) + 30px)) scale(.4) rotate(420deg)}
}
@keyframes shake{0%,43.5%,49%,63.5%,66%,100%{transform:translate(0,0)}44.5%{transform:translate(-4px,3px)}45.5%{transform:translate(4px,-3px)}46.5%{transform:translate(-3px,2px)}47.5%{transform:translate(2px,2px)}64.2%{transform:translate(-2px,1px)}64.8%{transform:translate(2px,-1px)}}
@keyframes earthGlow{0%,60%{filter:brightness(1)}66%{filter:brightness(1.35)}74%{filter:brightness(1.1)}86%{filter:brightness(1.25)}100%{filter:brightness(1)}}
@keyframes bubble{0%,68%{opacity:0;transform:translate(-50%,6px) scale(.8)}73%{opacity:1;transform:translate(-50%,0) scale(1)}86%{opacity:1;transform:translate(-50%,0) scale(1)}92%,100%{opacity:0;transform:translate(-50%,-6px) scale(.95)}}

@media (prefers-reduced-motion:reduce){
  .star{animation:none}.playing *{animation:none!important}.meteor{opacity:0}.card{transition:none}
}
</style>
</head>
<body>
<div class="space" id="space"></div>
<main class="center">
  <div class="card-scale" id="cardScale">
    <article class="card" id="card" tabindex="0" role="button" aria-label="Tier 04 Nova — คลิกเพื่อเล่นซ้ำ">
      <header class="head">
        <span class="badge">Tier 04</span>
        <span class="rank">Legendary</span>
        <div class="icons">
          <button type="button" aria-label="diamond">💎</button>
          <button type="button" class="fav" id="fav" aria-label="favorite">♥</button>
        </div>
      </header>

      <div class="stage playing" id="stage">
        <div class="shake">
          <div class="sky" id="sky"></div>
          <div class="danger"></div>
          <div class="earth"></div>

          <div class="meteor">
            <div class="trail"></div>
            <svg class="rock" viewBox="0 0 52 48" aria-hidden="true">

              <path d="M14 6 L30 2 L44 10 L50 24 L44 40 L28 46 L12 42 L3 28 L6 14 Z" fill="url(#rockG)" stroke="#2a1b16" stroke-width="1.5"/>
              <circle cx="20" cy="18" r="4" fill="#2a1b16" opacity=".7"/><circle cx="34" cy="30" r="5.5" fill="#2a1b16" opacity=".7"/><circle cx="16" cy="34" r="3" fill="#2a1b16" opacity=".6"/>
              <path class="crack" d="M22 8 L26 20 L18 26 L30 36 M26 20 L38 16 M30 36 L40 42" fill="none" stroke="#fde68a" stroke-width="1.8" stroke-linecap="round" style="filter:drop-shadow(0 0 3px #fbbf24)"/>

<script>
(() => {
  const stage=document.getElementById('stage'),card=document.getElementById('card');
  const sky=document.getElementById('sky');let s='';
  for(let i=0;i<45;i++)s+=`<span class="dot" style="left:${Math.random()*100}%;top:${Math.random()*72}%;opacity:${.2+Math.random()*.7};transform:scale(${.6+Math.random()})"></span>`;
  sky.innerHTML=s;

  /* meteor shards: rock chunks + ember sparks flying out from the impact point */
  const rock='<svg viewBox="0 0 14 12"><path d="M2 3 L7 0 L13 4 L11 11 L4 12 L0 8Z" fill="#5b4038" stroke="#fbbf24" stroke-width="1"/></svg>';
  const ember='<svg viewBox="0 0 14 12"><circle cx="7" cy="6" r="4" fill="#fde68a"/></svg>';
  document.querySelectorAll('.fx-shard').forEach((el,i,all)=>{
    const a=(i/all.length)*Math.PI*2+.2,d=70+(i%4)*22;
    el.style.setProperty('--tx',Math.cos(a)*d+'px');el.style.setProperty('--ty',Math.sin(a)*d+'px');
    el.innerHTML=i%3?rock:ember;
  });

  function replay(){stage.classList.remove('playing');void stage.offsetWidth;stage.classList.add('playing')}
  card.addEventListener('click',e=>{if(e.target.closest('.icons'))return;replay()});
  card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();replay()}});
  document.getElementById('fav').addEventListener('click',e=>e.currentTarget.classList.toggle('on'));

  const space=document.getElementById('space'),frag=document.createDocumentFragment();
  for(let i=0;i<28;i++){const el=document.createElement('span');el.className='star';
    el.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;--s:${1+Math.random()*2.2}px;--t:${2.5+Math.random()*3}s;--d:-${Math.random()*4}s`;frag.appendChild(el)}
  space.appendChild(frag);

  const scaler=document.getElementById('cardScale');
  function fit(){scaler.style.setProperty('--scale',Math.min(1,(innerWidth-32)/400,(innerHeight-32)/550).toFixed(3))}
  fit();addEventListener('resize',fit);
})();
</script>
