<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURUM Live — Tier 03 Comet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@600;700;800&family=Kanit:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   AURUM Live — Tier 03 "Comet" gift card
   ---------------------------------------------------------------------
   Scene inside .stage (300×300, clipped)
     .scene           space backdrop: star dots + warp streaks (flight only)
     .pad             landing pad at the bottom (glow ring, pulses when idle)
     .flyer           group that flies in from bottom-left (tail + body)
       img.tail       comet tail, full 1024-frame → fades out on landing
       .body-wrap     body positioned exactly where it sits inside the tail
         img.body     the mascot (background/tail removed)
         .shades      SVG sunglasses that drop on after landing
     .fx-shock        shockwave ring on impact
     .fx-spark ×10    sparks that fly out on impact
     .fx-bubble       "ลงจอดเรียบร้อย" speech bubble
   Master timeline: 6.5s
       0.0–1.6s  ( 0–24.6%)   flying in fast (warp streaks stream past)
       1.6–2.2s  (24.6–33.8%) tail burns off, body turns upright, descends
       2.2–2.35s (33.8–36.2%) impact: squash, shockwave, sparks, camera shake
       2.35–3.6s (36.2–55.4%) stand up cool: lean, shades drop on, lens glint
       3.6–6.5s  (55.4–100%)  idle stance, pad pulses → loop
   ===================================================================== */
:root{
  --bg-top:#1a0a3e;--bg-bot:#0a0a2e;
  --purple:#a855f7;--cyan:#06b6d4;--gold:#fbbf24;--text:#fff;--text-2:#94a3b8;
  --cycle:6.5s;--bounce:cubic-bezier(0.34,1.56,0.64,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Inter",system-ui,sans-serif;background:#050416;color:var(--text);overflow:hidden;-webkit-tap-highlight-color:transparent}

.space{position:fixed;inset:0;
  background:radial-gradient(60% 50% at 20% 80%,rgba(168,85,247,.18),transparent 70%),
             radial-gradient(50% 45% at 85% 15%,rgba(6,182,212,.14),transparent 70%),
             linear-gradient(180deg,#0c0630,#050416)}
.star{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:#fff;opacity:.25;animation:twinkle var(--t) ease-in-out infinite var(--d)}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.9;transform:scale(1.15)}}

.center{position:relative;min-height:100dvh;display:grid;place-items:center;padding:24px}
.card-scale{transform:scale(var(--scale,1));transform-origin:center}

.card{position:relative;width:400px;height:550px;border-radius:28px;padding:22px 24px 24px;display:flex;flex-direction:column;
  cursor:pointer;user-select:none;background:linear-gradient(180deg,var(--bg-top),var(--bg-bot));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 24px rgba(168,85,247,.30);
  transition:transform .35s var(--bounce),box-shadow .35s ease;isolation:isolate}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;
  background:linear-gradient(135deg,rgba(168,85,247,.55),rgba(6,182,212,.55));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.6;pointer-events:none}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 60% at 50% -10%,rgba(255,255,255,.08),transparent 60%)}
.card:hover,.card:focus-visible{transform:translateY(-4px);box-shadow:0 34px 70px rgba(0,0,0,.6),0 0 44px rgba(6,182,212,.5);outline:none}
.card:focus-visible{box-shadow:0 34px 70px rgba(0,0,0,.6),0 0 0 3px rgba(6,182,212,.7)}
.card:hover .name{text-shadow:0 0 18px rgba(6,182,212,.9),0 0 40px rgba(6,182,212,.5)}

.head{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.08em}
.badge{font-family:"Bebas Neue",sans-serif;font-size:13px;letter-spacing:.14em;padding:4px 9px 3px;border-radius:6px;
  background:rgba(251,191,36,.18);color:#fde68a;border:1px solid rgba(251,191,36,.5)}
.rank{font-family:"Bebas Neue",sans-serif;font-size:14px;letter-spacing:.14em;color:var(--text-2)}
.icons{margin-left:auto;display:flex;gap:8px;align-items:center}
.icons button{background:none;border:0;cursor:pointer;font-size:16px;line-height:1;color:var(--text-2);transition:transform .2s var(--bounce),color .2s;padding:2px}
.icons button:hover{transform:scale(1.2)} .icons .fav.on{color:#f472b6;text-shadow:0 0 10px rgba(244,114,182,.8)}

/* ---------- Stage / scene ---------- */
.stage{position:relative;width:300px;height:300px;margin:10px auto 0;border-radius:20px;overflow:hidden;
  background:radial-gradient(80% 60% at 70% 30%,rgba(6,182,212,.12),transparent 60%),radial-gradient(60% 40% at 30% 80%,rgba(168,85,247,.18),transparent 60%),#0b0730}
.scene{position:absolute;inset:0;pointer-events:none}
.dot{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.5}
.streak{position:absolute;left:var(--x);top:var(--y);width:var(--w);height:2px;border-radius:2px;opacity:0;
  background:linear-gradient(90deg,transparent,rgba(165,243,252,.9),rgba(6,182,212,0));
  transform:rotate(-32deg);transform-origin:left center;filter:blur(.3px)}
.pad{position:absolute;left:50%;bottom:14px;width:190px;height:40px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(ellipse,rgba(6,182,212,.35),rgba(6,182,212,.08) 55%,transparent 72%);opacity:.35}
.pad::before{content:"";position:absolute;inset:6px 22px;border-radius:50%;border:1.5px solid rgba(165,243,252,.55);box-shadow:0 0 12px rgba(6,182,212,.6)}

.flyer{position:absolute;inset:0;transform:translate(-260px,230px) scale(.45);will-change:transform}
.tail{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;
  filter:drop-shadow(0 0 14px rgba(6,182,212,.6))}
/* body sits exactly where it was inside the original 1024 frame */
.body-wrap{position:absolute;left:109.3px;top:23.4px;width:210.4px;height:210.4px;transform-origin:50.4% 54%;will-change:transform}
.body{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;filter:drop-shadow(0 0 10px rgba(6,182,212,.55))}
.shades{position:absolute;left:56.4%;top:40.8%;width:84px;height:27px;transform:translate(-50%,-50%) translateY(-60px) rotate(2.5deg);opacity:0;shape-rendering:crispEdges;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));will-change:transform,opacity}
.shades .glint{opacity:0}

.fx{position:absolute;pointer-events:none;opacity:0;will-change:transform,opacity}
.fx-shock{left:50%;bottom:26px;width:60px;height:22px;border-radius:50%;transform:translateX(-50%) scale(.2);
  border:3px solid rgba(165,243,252,.9);box-shadow:0 0 18px rgba(6,182,212,.9),inset 0 0 12px rgba(6,182,212,.6)}
.fx-spark{left:50%;bottom:30px;width:5px;height:5px;border-radius:50%;background:#fde68a;box-shadow:0 0 6px #fbbf24;transform:translate(-50%,0)}
.fx-spark:nth-child(even){background:#a5f3fc;box-shadow:0 0 6px #06b6d4}
.fx-bubble{left:50%;top:44px;margin-left:-84px;transform:translate(-50%,0) scale(.8);font:500 15px/1 "Kanit",sans-serif;color:#1a0a3e;
  background:#fff;padding:8px 12px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.3);white-space:nowrap}
.fx-bubble::after{content:"";position:absolute;right:14px;bottom:-7px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}

.name{margin-top:14px;font-family:"Bebas Neue",sans-serif;font-size:58px;line-height:.95;letter-spacing:.1em;text-align:center;text-shadow:0 0 14px rgba(6,182,212,.5);transition:text-shadow .35s ease}
.sub{font-family:"Kanit",sans-serif;font-weight:500;font-size:15px;color:var(--text-2);text-align:center;margin-top:2px}
.foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
.price{font:800 14px/1 "Inter",sans-serif;letter-spacing:.06em;padding:10px 16px;border-radius:999px;color:#04131a;background:linear-gradient(135deg,#67e8f9,var(--cyan));box-shadow:0 0 18px rgba(6,182,212,.45)}
.sent{font-size:12px;color:var(--text-2)} .sent b{font-weight:700;color:var(--gold)}

/* ---------- Master timeline ---------- */
.playing .flyer{animation:flyIn var(--cycle) cubic-bezier(.2,.9,.3,1) infinite}
.playing .tail{animation:tailOff var(--cycle) ease-in infinite}
.playing .body-wrap{animation:landStand var(--cycle) ease-out infinite}
.playing .streak{animation:warp var(--cycle) linear infinite var(--d)}
.playing .stage-shake{animation:shake var(--cycle) linear infinite}
.playing .pad{animation:padGlow var(--cycle) ease-in-out infinite}
.playing .fx-shock{animation:shock var(--cycle) ease-out infinite}
.playing .fx-spark{animation:spark var(--cycle) ease-out infinite}
.playing .shades{animation:shadesDrop var(--cycle) var(--bounce) infinite}
.playing .shades .glint{animation:lensGlint var(--cycle) ease-in-out infinite}
.playing .fx-bubble{animation:bubble var(--cycle) var(--bounce) infinite}

@keyframes flyIn{
  0%{transform:translate(-260px,230px) scale(.45)}
  24.6%,100%{transform:translate(0,0) scale(1)}
}
@keyframes tailOff{
  0%,24.6%{opacity:1;transform:scale(1)}
  33.8%,100%{opacity:0;transform:translate(-40px,30px) scale(.6)}
}
/* upright = rotate(-30deg); pad centre = translate(-58px,48px) in the flyer frame */
@keyframes landStand{
  0%,24.6%{transform:translate(0,0) rotate(0)}
  33.8%{transform:translate(-58px,48px) rotate(-30deg) scale(1)}
  36.2%{transform:translate(-58px,54px) rotate(-30deg) scale(1.12,.86)}
  40%  {transform:translate(-58px,46px) rotate(-30deg) scale(.97,1.04)}
  44.6%{transform:translate(-58px,48px) rotate(-34deg) scale(1)}
  55.4%{transform:translate(-58px,48px) rotate(-34deg) scale(1)}
  80%  {transform:translate(-58px,47px) rotate(-34deg) scale(1.02)}
  100% {transform:translate(-58px,48px) rotate(-34deg) scale(1)}
}
@keyframes warp{
  0%{opacity:0;transform:rotate(-32deg) translateX(120px) scaleX(.2)}
  4%{opacity:.9}
  9%{opacity:0;transform:rotate(-32deg) translateX(-240px) scaleX(1.4)}
  9.1%{opacity:0;transform:rotate(-32deg) translateX(120px) scaleX(.2)}
  13%{opacity:.9}
  18%{opacity:0;transform:rotate(-32deg) translateX(-240px) scaleX(1.4)}
  18.1%{opacity:0;transform:rotate(-32deg) translateX(120px) scaleX(.2)}
  22%{opacity:.7}
  27%,100%{opacity:0;transform:rotate(-32deg) translateX(-240px) scaleX(1.4)}
}
@keyframes shake{
  0%,33.8%,38%,100%{transform:translate(0,0)}
  34.4%{transform:translate(-3px,2px)}35%{transform:translate(3px,-2px)}35.6%{transform:translate(-2px,1px)}36.2%{transform:translate(2px,1px)}37%{transform:translate(-1px,0)}
}
@keyframes padGlow{0%,30%{opacity:.35}34%{opacity:1}44%{opacity:.7}70%{opacity:.95}100%{opacity:.6}}
@keyframes shock{
  0%,33.8%{opacity:0;transform:translateX(-50%) scale(.2)}
  35%{opacity:1}
  46%,100%{opacity:0;transform:translateX(-50%) scale(3.2)}
}
@keyframes spark{
  0%,33.8%{opacity:0;transform:translate(-50%,0) scale(.5)}
  35%{opacity:1;transform:translate(calc(-50% + var(--tx)*.3),calc(var(--ty)*.3)) scale(1.2)}
  47%,100%{opacity:0;transform:translate(calc(-50% + var(--tx)),calc(var(--ty) + 22px)) scale(.3)}
}
@keyframes shadesDrop{
  0%,44.6%{opacity:0;transform:translate(-50%,-50%) translateY(-60px) rotate(6deg)}
  49.2%{opacity:1;transform:translate(-50%,-50%) translateY(0) rotate(2.5deg)}
  100%{opacity:1;transform:translate(-50%,-50%) translateY(0) rotate(2.5deg)}
}
@keyframes lensGlint{0%,49.2%{opacity:0;transform:translateX(-6px)}52%{opacity:1}56%,100%{opacity:0;transform:translateX(18px)}}
@keyframes bubble{
  0%,50%{opacity:0;transform:translate(-50%,6px) scale(.8)}
  55.4%{opacity:1;transform:translate(-50%,0) scale(1)}
  66%{opacity:1;transform:translate(-50%,0) scale(1)}
  72%,100%{opacity:0;transform:translate(-50%,-6px) scale(.95)}
}
@media (prefers-reduced-motion:reduce){
  .star{animation:none}
  .playing *{animation:none!important}
  .flyer{transform:none}.tail{opacity:0}.body-wrap{transform:translate(-58px,48px) rotate(-34deg)}.shades{opacity:1;transform:translate(-50%,-50%) rotate(2.5deg)}
  .card{transition:none}
}
</style>
</head>

<script>
(() => {
  const stage=document.getElementById('stage'),card=document.getElementById('card');

  /* scene: 40 static star dots + 14 warp streaks (diagonal, matching the flight path) */
  const scene=document.getElementById('scene');let s='';
  for(let i=0;i<40;i++)s+=`<span class="dot" style="left:${Math.random()*100}%;top:${Math.random()*100}%;opacity:${.2+Math.random()*.6}"></span>`;
  for(let i=0;i<14;i++)s+=`<span class="streak" style="--x:${20+Math.random()*90}%;--y:${-10+Math.random()*90}%;--w:${50+Math.random()*90}px;--d:-${(Math.random()*.55).toFixed(2)}s"></span>`;
  scene.innerHTML=s;

  /* sparks fan out from the landing point */
  document.querySelectorAll('.fx-spark').forEach((el,i,all)=>{
    const a=Math.PI+ (i/(all.length-1))*Math.PI, d=70+(i%3)*25;
    el.style.setProperty('--tx',Math.cos(a)*d+'px'); el.style.setProperty('--ty',Math.sin(a)*d*.55+'px');
  });

  function replay(){stage.classList.remove('playing');void stage.offsetWidth;stage.classList.add('playing')}
  card.addEventListener('click',e=>{if(e.target.closest('.icons'))return;replay()});
  card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();replay()}});
  document.getElementById('fav').addEventListener('click',e=>e.currentTarget.classList.toggle('on'));

  const space=document.getElementById('space'),frag=document.createDocumentFragment();
  for(let i=0;i<28;i++){const el=document.createElement('span');el.className='star';
    el.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;--s:${1+Math.random()*2.2}px;--t:${2.5+Math.random()*3}s;--d:-${Math.random()*4}s`;frag.appendChild(el)}
  space.appendChild(frag);

  const scaler=document.getElementById('cardScale');
  function fit(){scaler.style.setProperty('--scale',Math.min(1,(innerWidth-32)/400,(innerHeight-32)/550).toFixed(3))}
  fit();addEventListener('resize',fit);
})();
</script>
